    <ellipse cx="370" cy="950" rx="460" ry="380" fill="url(#sky-glow)"/>
  </g>
  <g id="door-frame">
    <path d="M824 229.91V236H530V132Z" fill="url(#frame)"/>
  </g>
  <g id="light">
