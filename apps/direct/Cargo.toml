[package]
name = "lobby-direct"
version = "0.1.0"
edition = "2024"
publish = false
license = "MPL-2.0"
description = "The server's end of a direct connection. Lobby Server starts it."

[dependencies]
# The same API in two crates: see docs/outside.md, "Congestion", for the measurement behind the choice.
quic = { package = "quinn", version = "=0.11.12", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
base64 = "0.22"
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["rt", "net", "io-util", "io-std", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[features]
# For tools that compare congestion control. Never in what is deployed.
measure = []
