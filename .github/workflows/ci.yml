# Checks every push and pull request. The Node jobs always run; lobby-direct, LobbyKit, the Apple
# apps and the container image run only when their files (or what they depend on) changed. It
# needs no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The Xcode the apps are built with, not the image's newest: a newer Swift can refuse what this
  # one takes (Xcode 26.6 gave up type-checking a test). macos-26 has it; move both together.
  XCODE: "26.2"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      direct: ${{ steps.paths.outputs.direct }}
      lobbykit: ${{ steps.paths.outputs.lobbykit }}
      apps: ${{ steps.paths.outputs.apps }}
      image: ${{ steps.paths.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: What changed
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch or an unknown base: check everything.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed="everything"
          else
            changed="$(git diff --name-only "$BASE" HEAD)"
          fi
          echo "$changed"
          touched() {
            [ "$changed" = everything ] && return 0
            printf '%s\n' "$changed" | grep -qE "$1"
          }
          flag() { if touched "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          flag direct '^(apps/direct/|apps/server/src/outside/|\.github/workflows/ci\.yml)'
          flag lobbykit '^(packages/|docs/api\.md|\.github/workflows/ci\.yml)'
          flag apps '^(apps/apple/|packages/|\.github/workflows/ci\.yml)'
          flag image '^(tools/release/docker/|apps/server/(src/|package\.json)|apps/direct/|package-lock\.json)'

  server:
    name: Server, lint and typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg dash
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -w apps/server
      - run: npm test -w tools/release

  introducer:
    name: Introducer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w apps/introducer

  push-relay:
    name: Push relay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w apps/push-relay

  direct:
    name: lobby-direct
    needs: changes
    if: needs.changes.outputs.direct == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/direct
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.90.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --release

  lobbykit:
    name: LobbyKit
    needs: changes
    if: needs.changes.outputs.lobbykit == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Xcode ${{ env.XCODE }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"
          xcodebuild -version
          swift --version
      - run: swift test --package-path packages/LobbyKit

  apps:
    name: Apple apps (${{ matrix.scheme }})
    needs: changes
    if: needs.changes.outputs.apps == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scheme: Lobby, destination: "generic/platform=iOS Simulator" }
          - { scheme: LobbyMac, destination: "generic/platform=macOS" }
          - { scheme: LobbyTV, destination: "generic/platform=tvOS Simulator" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Xcode ${{ env.XCODE }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"
          xcodebuild -version
          swift --version
      - run: brew install xcodegen
      - run: npm run apple:generate
      - name: Build, unsigned
        run: |
          xcodebuild build-for-testing \
            -project apps/apple/Lobby.xcodeproj -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO

  image:
    name: Container image (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          # On an arm64 runner of its own, as the release builds it: under QEMU, compiling
          # lobby-direct takes many times as long.
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build the image, as the release does
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            -f tools/release/docker/Dockerfile --load -t lobby-server:ci .
      - name: It starts and answers
        run: |
          docker run -d --name lobby -p 127.0.0.1:8674:8674 lobby-server:ci
          for _ in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8674/v1/server; then echo; exit 0; fi
            sleep 1
          done
          docker logs lobby
          exit 1
      - name: Its lobby-direct runs here
        run: docker run --rm --entrypoint /opt/lobby/bin/lobby-direct lobby-server:ci < /dev/null
